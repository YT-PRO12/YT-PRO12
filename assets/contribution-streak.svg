<text x="101" y="126" fill="#f0f6fc" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" text-anchor="middle">90</text>
<text x="101" y="147" fill="#8b949e" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle">day goal</text>

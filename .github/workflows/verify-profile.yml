name: Verify GitHub profile
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check profile links
        run: python scripts/check_profile_readme.py
      - name: Validate SVG banners
        run: python scripts/check_profile_assets.py
      - name: Check accessible SVG labels
        run: python scripts/check_banner_accessibility.py
      - name: Run profile banner regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
